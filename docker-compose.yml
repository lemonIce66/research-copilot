services:
  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - backend_data:/app/data
    env_file:
      - ./apps/backend/.env
    environment:
      - BACKEND_PORT=8000
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000

  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
      args:
        # Browser-side backend URL. Change this to your deployed backend URL when going live.
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
    depends_on:
      - backend

volumes:
  backend_data:
